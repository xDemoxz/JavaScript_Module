<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUD Productos</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black">
<main class="max-w-2xl mx-auto p-6">
<h1 class="text-3xl font-bold text-green-600 mb-6">Gestión de Productos</h1>

<form id="productForm" class="space-y-3">
<input id="name" type="text" placeholder="Nombre" class="w-full border p-2 rounded">
<input id="price" type="number" placeholder="Precio" class="w-full border p-2 rounded">

<button class="bg-green-600 text-white px-4 py-2 rounded">
Guardar
</button>
</form>

<div id="message" class="mt-4 font-semibold"></div>

<ul id="productList" class="mt-6 space-y-2"></ul>

<button id="syncBtn" class="mt-6 bg-black text-white px-4 py-2 rounded">
Sincronizar API
</button>
</main>

<script type="module" src="./src/app.js"></script>
</body>
</html>
